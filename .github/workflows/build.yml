name: "Build and Cache"
on: [push]
jobs:
  build:
    if: false # disable for now
    runs-on: ubuntu-latest
    # runs-on: [self-hosted, nixos]
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@31.3.0
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v16
      with:
        name: kor
        # If you chose API tokens for write access OR if you have a private cache
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    # Attic cache setup
    # - name: Setup Attic cache
    #   uses: ryanccn/attic-action@v0.3.2
    #   with:
    #     endpoint: ${{ secrets.ATTIC_ENDPOINT }}
    #     cache: ${{ secrets.ATTIC_CACHE }}
    #     token: ${{ secrets.ATTIC_TOKEN }}
    - run: nix build -f nilla.nix systems.nixos.kor.result.config.system.build.toplevel
    - run: nix build -f nilla.nix systems.home."j@kor".result.activationPackage
